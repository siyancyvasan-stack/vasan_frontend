<div class="min-h-screen flex items-center justify-center bg-gradient-to-tr from-purple-100 via-pink-100 to-sky-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-lg border border-gray-200/50">
    <div class="space-y-4">
       <div class="flex items-center justify-center gap-3">
        <div class="p-2 bg-gray-800 rounded-lg">
          <div class="grid grid-cols-2 grid-rows-2 gap-1.5">
            <span class="w-3 h-3 bg-white rounded-full"></span>
            <span class="w-3 h-3 bg-white rounded-full"></span>
            <span class="w-3 h-3 bg-white rounded-full"></span>
            <span class="w-3 h-3 bg-white rounded-full"></span>
          </div>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Lumina</h1>
          <p class="text-xs font-medium text-gray-500 tracking-widest">ERP & AI SUITE</p>
        </div>
      </div>
      <div class="text-center">
        <h2 class="text-3xl font-bold text-gray-900">
          Select a Role
        </h2>
        <p class="mt-2 text-sm text-gray-600">
          Sign in as a specific user to experience the system.
        </p>
      </div>
    </div>
    
    <div class="mt-8 space-y-4">
      <button (click)="onLogin('Admin')"
              class="group relative w-full flex items-center justify-start py-4 px-6 border text-lg font-medium rounded-md text-gray-700 bg-gray-50 hover:bg-gray-100 hover:border-purple-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 shadow-sm transition-all">
        <i class="fa-solid fa-user-shield text-purple-600 w-8 text-center"></i>
        <span class="ml-4">Login as Admin</span>
      </button>
      <button (click)="onLogin('Finance Manager')"
              class="group relative w-full flex items-center justify-start py-4 px-6 border text-lg font-medium rounded-md text-gray-700 bg-gray-50 hover:bg-gray-100 hover:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 shadow-sm transition-all">
        <i class="fa-solid fa-user-tie text-cyan-600 w-8 text-center"></i>
        <span class="ml-4">Login as Finance Manager</span>
      </button>
      <button (click)="onLogin('Employee')"
              class="group relative w-full flex items-center justify-start py-4 px-6 border text-lg font-medium rounded-md text-gray-700 bg-gray-50 hover:bg-gray-100 hover:border-sky-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 shadow-sm transition-all">
        <i class="fa-solid fa-user text-sky-600 w-8 text-center"></i>
        <span class="ml-4">Login as Employee</span>
      </button>
    </div>
  </div>
</div>
